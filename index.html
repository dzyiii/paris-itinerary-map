  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <style>
    :root {
      --ink: #20283c;
      --muted: #697184;
      --paper: #f7f3eb;
      --panel: rgba(255,255,255,.88);
      --line: rgba(32,40,60,.12);
      --accent: #e95d52;
      --gold: #d7a84b;
      --shadow: 0 24px 70px rgba(43, 48, 64, .14);
      --day: #df655b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 5%, rgba(232,174,99,.22), transparent 28rem),
        radial-gradient(circle at 86% 92%, rgba(92,119,152,.13), transparent 30rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    .shell { max-width: 1480px; margin: 0 auto; padding: 22px; }
    .topbar {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 16px;
    }
    .eyebrow { margin: 0 0 2px; color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", "Songti SC", serif; font-size: clamp(2rem, 4vw, 3.6rem); font-weight: 500; line-height: 1.05; letter-spacing: -.035em; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: .95rem; }
    .dates {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.58);
      backdrop-filter: blur(14px);
    }
    .dates::-webkit-scrollbar { display: none; }
    .day-btn {
      border: 0;
      border-radius: 13px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      min-width: 78px;
      padding: 10px 13px;
      font: inherit;
      font-weight: 750;
      transition: .2s ease;
    }
    .day-btn:hover { color: var(--ink); background: rgba(255,255,255,.74); }
    .day-btn.active { color: white; background: var(--ink); box-shadow: 0 8px 20px rgba(32,40,60,.2); }
    .workspace {
      display: grid;
      grid-template-columns: minmax(330px, 410px) minmax(0, 1fr);
      height: min(780px, calc(100vh - 150px));
      min-height: 610px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .itinerary { overflow: auto; padding: 24px 22px 32px; border-right: 1px solid var(--line); scrollbar-width: thin; }
    .day-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 20px; }
    .day-kicker { color: var(--day); font-size: .77rem; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    .day-title { margin: 3px 0 0; font-family: Georgia, "Times New Roman", "Songti SC", serif; font-size: 1.7rem; font-weight: 500; line-height: 1.2; }
    .weather-note { padding: 7px 10px; border-radius: 999px; color: var(--muted); background: #f3f0e9; font-size: .76rem; white-space: nowrap; }
    .timeline { position: relative; }
    .stop { position: relative; display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
    .track { display: flex; flex-direction: column; align-items: center; }
    .num {
      z-index: 1;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 10px 10px 10px 3px;
      color: white;
      background: var(--day);
      box-shadow: 0 5px 14px color-mix(in srgb, var(--day) 35%, transparent);
      font-size: .77rem;
      font-weight: 850;
    }
    .stop.alt .num { color: var(--day); background: white; border: 2px dashed var(--day); box-shadow: none; }
    .stem { width: 1px; flex: 1; min-height: 48px; background: linear-gradient(var(--day), rgba(32,40,60,.12)); }
    .stop:last-child .stem { display: none; }
    .stop-card { padding: 0 0 15px; min-width: 0; }
    .time { margin-bottom: 3px; color: var(--muted); font-size: .76rem; font-weight: 800; letter-spacing: .04em; }
    .place-link { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; font-size: 1rem; font-weight: 820; }
    .place-link:hover { color: var(--day); }
    .place-link::after { content: "↗"; font-size: .75rem; opacity: .5; }
    .meta { margin: 4px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.45; }
    .hours-alert {
      display: block;
      margin-top: 4px;
      color: #c4554d;
      font-weight: 780;
    }
    .hours-alert::before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-right: 6px;
      border-radius: 50%;
      background: currentColor;
      vertical-align: 2px;
    }
    .choice { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 999px; color: #97572e; background: #fff0da; font-size: .68rem; font-weight: 850; vertical-align: 2px; }
    .choice.primary { color: #28665f; background: #e8f4f1; }
    .choice.backup { color: var(--day); background: color-mix(in srgb, var(--day) 10%, white); border: 1px dashed color-mix(in srgb, var(--day) 55%, white); }
    .transfer { display: flex; align-items: center; gap: 7px; margin: 0 0 14px 46px; color: #596174; font-size: .76rem; }
    .transfer::before { content: ""; width: 20px; border-top: 1px dashed rgba(32,40,60,.28); }
    .mode { padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: white; font-weight: 760; }
    .map-wrap { position: relative; min-width: 0; min-height: 0; }
    #map { width: 100%; height: 100%; background: #dce5e8; }
    .map-note {
      position: absolute;
      z-index: 800;
      right: 16px;
      top: 16px;
      width: min(280px, calc(100% - 32px));
      padding: 11px 13px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 15px;
      color: #475064;
      background: rgba(255,255,255,.88);
      box-shadow: 0 8px 24px rgba(29,39,56,.12);
      backdrop-filter: blur(12px);
      font-size: .76rem;
    }
    .legend { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--day); }
    .legend .alt-dot { background: white; border: 2px dashed var(--day); }
    .map-filter {
      position: absolute;
      z-index: 800;
      left: 16px;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.88);
      border-radius: 999px;
      color: #3f485b;
      background: rgba(255,255,255,.92);
      box-shadow: 0 8px 24px rgba(29,39,56,.14);
      backdrop-filter: blur(12px);
      cursor: pointer;
      font-size: .76rem;
      font-weight: 800;
      user-select: none;
    }
    .map-filter input { width: 16px; height: 16px; margin: 0; accent-color: var(--day); cursor: pointer; }
    .leaflet-control-zoom { border: 0 !important; box-shadow: 0 8px 25px rgba(29,39,56,.14) !important; }
    .leaflet-control-zoom a { color: var(--ink) !important; border: 0 !important; }
    .leaflet-control-attribution { font-size: 9px !important; }
    .route-label {
      padding: 4px 7px;
      border: 0;
      border-radius: 999px;
      color: #3e4657;
      background: rgba(255,255,255,.93);
      box-shadow: 0 4px 13px rgba(30,37,51,.16);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }
    .route-label::before { display: none; }
    .pin-wrap { background: transparent; border: 0; }
    .pin { position: relative; display: grid; place-items: center; width: 34px; height: 34px; border: 3px solid white; border-radius: 12px 12px 12px 4px; color: white; background: var(--pin); box-shadow: 0 7px 18px rgba(28,34,48,.25); font-size: 12px; font-weight: 900; transform: rotate(-45deg); }
    .pin b { transform: rotate(45deg); }
    .pin.altpin { color: var(--pin); background: white; border-color: var(--pin); border-style: dashed; }
    .map-place-label { margin-left: 15px !important; padding: 5px 8px; border: 0; border-radius: 9px; color: #232a3d; background: rgba(255,255,255,.92); box-shadow: 0 4px 12px rgba(32,40,60,.14); font-size: 11px; font-weight: 800; }
    .map-place-label::before { display: none; }
    .popup h3 { margin: 0 0 4px; font-size: .95rem; }
    .popup p { margin: 0 0 8px; color: #697184; font-size: .76rem; }
    .popup a { color: #c94e45; font-weight: 800; text-decoration: none; }
    .foot { display: flex; justify-content: space-between; gap: 16px; margin: 13px 4px 0; color: #747b89; font-size: .75rem; }
    .foot strong { color: var(--ink); }
    .fallback { display: none; height: 100%; place-items: center; padding: 40px; text-align: center; color: var(--muted); }
    @media (max-width: 900px) {
      .shell { padding: 16px; }
      .topbar { grid-template-columns: 1fr; align-items: start; }
      .dates { width: 100%; }
      .workspace { grid-template-columns: 1fr; height: auto; min-height: 0; overflow: visible; }
      .itinerary { max-height: none; overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }
      .map-wrap { height: 58vh; min-height: 430px; }
      .map-note { top: 12px; right: 12px; }
      .map-filter { left: 12px; bottom: 12px; }
      .foot { flex-direction: column; gap: 3px; }
    }
    @media (max-width: 520px) {
      .shell { padding: 12px; }
      .subtitle { font-size: .86rem; }
      .workspace { border-radius: 20px; }
      .itinerary { padding: 20px 16px 26px; }
      .weather-note { display: none; }
      .day-btn { min-width: 66px; padding: 9px 10px; }
      .map-wrap { height: 62vh; min-height: 390px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>

          {time:'11:40', name:'Grand Palais 大皇宫', note:'以建筑与公共区域为主，不安排长时间正式看展', lat:48.86610, lng:2.31245, query:'Grand Palais Paris'},
          {time:'12:15', name:'Le Grand Café · Grand Palais', note:'坐下来喝咖啡 / 吃点东西', hours:'营业提示：每日 12:00 开门，抵达时刚开门不久', lat:48.86632, lng:2.31286, query:'Le Grand Café Grand Palais Paris', minor:true},
          {time:'14:30', name:'Yazid Ichemrahen · At Home', note:'44 Rue Croix des Petits Champs, 75001 Paris', lat:48.86473, lng:2.33916, query:'Yazid Ichemrahen At Home, 44 Rue Croix des Petits Champs, Paris', minor:true},
          {time:'16:30', name:"L'Howea", note:'第一处埃菲尔铁塔拍照点 · 18 Avenue Rapp, 75007 Paris；不登塔', lat:48.85904, lng:2.30011, query:"L'Howea, 18 Avenue Rapp, Paris"},
          {time:'17:00 起', name:'Bateau Boréas / Port Debilly', note:'先在河岸拍照；傍晚 / 晚上在此参加塞纳河夜游，请以预订集合信息为准', lat:48.86028, lng:2.29235, query:'Port Debilly Paris'}
        ],
        transfers:[
          {mode:'步行', mins:'约 12 分钟'}, {mode:'步行', mins:'约 22 分钟'},
          {mode:'步行', mins:'约 6 分钟'}, {mode:'步行', mins:'约 12 分钟'},
          {mode:'步行', mins:'约 3 分钟'}, {mode:'地铁 1 号线', mins:'约 20 分钟'},
          {mode:'地铁', mins:'约 30 分钟'}, {mode:'步行', mins:'约 13 分钟'}
        ]
      },
      {
        id:'10/5', kicker:'DAY 05 · 返程', title:'早餐，然后带着巴黎回家',
        stops:[
          {time:'早上', name:'78 Avenue des Champs-Élysées', note:'早餐、整理行李并退房', lat:48.87144, lng:2.30433, query:'78 Avenue des Champs-Élysées, 75008 Paris'},
          {time:'按中午航班倒推', name:'巴黎戴高乐机场 CDG', note:'建议国际航班至少提前 3 小时抵达；请按实际航站楼调整', lat:49.00969, lng:2.54792, query:'Paris Charles de Gaulle Airport'}
        ], transfers:[{mode:'地铁 1 号线 + RER B', mins:'约 60–70 分钟'}]
      }
    ];

    const tabs = document.getElementById('dateTabs');
    const timeline = document.getElementById('timeline');
    const kicker = document.getElementById('dayKicker');
    const title = document.getElementById('dayTitle');
    const summary = document.getElementById('mapSummary');
    const mainOnlyToggle = document.getElementById('mainOnlyToggle');
    let map, activeLayers = [], currentDayIndex = 0;

    days.forEach((day, i) => {
      const button = document.createElement('button');
      button.className = 'day-btn' + (i === 0 ? ' active' : '');
      button.textContent = day.id;
      button.type = 'button';
      button.setAttribute('aria-label', `查看 ${day.id} 行程`);
      button.addEventListener('click', () => renderDay(i));
      tabs.appendChild(button);
    });

    function mapsUrl(stop) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.query || `${stop.lat},${stop.lng}`)}`;
    }

    function renderTimeline(day) {
      timeline.innerHTML = '';
      day.stops.forEach((stop, i) => {
        const badge = stop.badge
          ? `<span class="choice ${stop.badgeClass || ''}">${stop.badge}</span>`
          : stop.alt
            ? '<span class="choice backup">候补</span>'
            : stop.optional
              ? '<span class="choice">可选</span>'
              : '';
        const item = document.createElement('article');
        item.className = 'stop' + (stop.alt ? ' alt' : '');
        item.innerHTML = `
          <div class="track"><span class="num">${stop.alt ? '＋' : i + 1}</span><span class="stem"></span></div>
          <div class="stop-card">
            <div class="time">${stop.time}${badge}</div>
            <a class="place-link" href="${mapsUrl(stop)}" target="_blank" rel="noopener noreferrer">${stop.name}</a>
            <p class="meta">${stop.note}${stop.hours ? `<span class="hours-alert">${stop.hours}</span>` : ''}</p>
          </div>`;
        timeline.appendChild(item);
        if (i < day.transfers.length && day.stops[i + 1] && !day.stops[i + 1].alt) {
          const transfer = day.transfers[i];
          const row = document.createElement('div');
          row.className = 'transfer';
          row.innerHTML = `<span class="mode">${transfer.mode}</span><span>${transfer.mins}</span>`;
          timeline.appendChild(row);
        }
      });
    }

    function clearMap() {
      activeLayers.forEach(layer => map.removeLayer(layer));
      activeLayers = [];
    }

    function midpoint(a, b) { return [(a.lat + b.lat) / 2, (a.lng + b.lng) / 2]; }

    function renderMap(day, dayIndex) {
      if (!map) return;
      clearMap();
      const color = COLORS[dayIndex];
      const mainOnly = mainOnlyToggle.checked;
      const visibleStops = day.stops.filter(stop => !mainOnly || !stop.minor);
      const routeStops = visibleStops.filter(stop => !stop.alt);
      document.documentElement.style.setProperty('--day', color);

      visibleStops.forEach(stop => {
        const i = day.stops.indexOf(stop);
        const icon = L.divIcon({
          className:'pin-wrap', iconSize:[34,34], iconAnchor:[17,29], popupAnchor:[0,-30],
          html:`<span class="pin ${stop.alt ? 'altpin' : ''}" style="--pin:${color}"><b>${stop.alt ? '＋' : i + 1}</b></span>`
        });
        const marker = L.marker([stop.lat, stop.lng], {icon}).addTo(map);
        marker.bindTooltip(stop.name, {permanent:true, direction:'right', className:'map-place-label', offset:[9,-7]});
        marker.bindPopup(`<div class="popup"><h3>${stop.name}</h3><p>${stop.note}${stop.hours ? `<br><strong>${stop.hours}</strong>` : ''}</p><a href="${mapsUrl(stop)}" target="_blank" rel="noopener">在 Google Maps 打开 ↗</a></div>`);
        activeLayers.push(marker);
      });

      if (routeStops.length > 1) {
        const line = L.polyline(routeStops.map(s => [s.lat,s.lng]), {color, weight:4, opacity:.72, lineCap:'round'}).addTo(map);
        activeLayers.push(line);
      }

      day.stops.forEach((stop, i) => {
        if (!stop.alt || !visibleStops.includes(stop)) return;
        const origin = day.stops[stop.branchFrom ?? Math.max(0, i - 1)];
        if (!visibleStops.includes(origin)) return;
        const branch = L.polyline([[origin.lat,origin.lng],[stop.lat,stop.lng]], {color, weight:2.5, opacity:.65, dashArray:'5 7'}).addTo(map);
        activeLayers.push(branch);
        if (stop.branchTransfer) {
          const label = L.tooltip({permanent:true, direction:'center', className:'route-label', opacity:1})
            .setLatLng(midpoint(origin, stop))
            .setContent(`${stop.branchTransfer.mode} · ${stop.branchTransfer.mins.replace('约 ','')}`).addTo(map);
          activeLayers.push(label);
        }
      });

      if (!mainOnly) {
        let mainIndex = 0;
        for (let i = 0; i < day.stops.length - 1; i++) {
          if (day.stops[i].alt || day.stops[i+1].alt) continue;
          const tr = day.transfers[Math.min(mainIndex, day.transfers.length - 1)];
          if (tr) {
            const label = L.tooltip({permanent:true, direction:'center', className:'route-label', opacity:1})
              .setLatLng(midpoint(day.stops[i], day.stops[i+1]))
              .setContent(`${tr.mode} · ${tr.mins.replace('约 ','')}`).addTo(map);
            activeLayers.push(label);
          }
          mainIndex++;
        }
      }

      const bounds = L.latLngBounds(visibleStops.map(s => [s.lat,s.lng]));
      map.fitBounds(bounds, {padding:[62,62], maxZoom:15});
      summary.textContent = mainOnly
        ? `${day.id} · ${routeStops.length} 个主要点（精简）`
        : `${day.id} · ${routeStops.length} 个固定点`;
    }

    function renderDay(index) {
      const day = days[index];
      currentDayIndex = index;
      document.documentElement.style.setProperty('--day', COLORS[index]);
      [...tabs.children].forEach((b, i) => {
        b.classList.toggle('active', i === index);
        b.setAttribute('aria-pressed', i === index ? 'true' : 'false');
      });
      kicker.textContent = day.kicker;
      title.textContent = day.title;
      renderTimeline(day);
      renderMap(day, index);
      if (window.innerWidth <= 900) document.querySelector('.itinerary').scrollTop = 0;
    }

    mainOnlyToggle.addEventListener('change', () => renderMap(days[currentDayIndex], currentDayIndex));

    if (window.L) {
      map = L.map('map', {zoomControl:false, scrollWheelZoom:true, minZoom:4}).setView([48.8647,2.3266], 13);
      L.control.zoom({position:'bottomright'}).addTo(map);
      if (L.maplibreGL) {
        L.maplibreGL({style:'https://tiles.openfreemap.org/styles/positron'}).addTo(map);
      } else {
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          maxZoom:19,
          attribution:'Tiles &copy; Esri · Data &copy; OpenStreetMap contributors'
        }).addTo(map);
      }
      renderDay(0);
    } else {
      document.getElementById('map').style.display = 'none';
      document.getElementById('fallback').style.display = 'grid';
      renderDay(0);
    }
  </script>
</body>
</html>
